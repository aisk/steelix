name: Release

# Pushing a tag `vX.Y.Z` publishes the crates to crates.io and steelix to
# PyPI, then creates the GitHub release (docs/design.md §14). Both registries
# trust this workflow (trusted publishing), so there are no tokens to keep.
#
# Every step skips what is already published, so a failed run can be rerun.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # the GitHub release
  id-token: write # trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.14.9

      # The same toolchain as CI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      # `cargo publish` builds the crates, and PyO3 needs the interpreter
      # that `.cargo/config.toml` names.
      - name: Set up the environment
        run: uv sync --locked

      - name: Check the versions
        id: versions
        run: uv run python .github/release_versions.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1

      # The runtime depends on the macros, so they go first. They are only
      # published when their version changed.
      - name: Publish steelix-runtime-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          VERSION: ${{ steps.versions.outputs.macros }}
        run: |
          published=$(.github/crate_published.sh steelix-runtime-macros "$VERSION")
          if [ "$published" = yes ]; then
            echo "steelix-runtime-macros $VERSION is already on crates.io"
          else
            cargo publish -p steelix-runtime-macros
          fi

      - name: Publish steelix-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          VERSION: ${{ steps.versions.outputs.runtime }}
        run: |
          published=$(.github/crate_published.sh steelix-runtime "$VERSION")
          if [ "$published" = yes ]; then
            echo "steelix-runtime $VERSION is already on crates.io"
          else
            cargo publish -p steelix-runtime
          fi

      # After the crates: the published steelix writes a dependency on this
      # version of the runtime into the crates it generates.
      - name: Publish steelix to PyPI
        run: |
          uv build
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "the release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
