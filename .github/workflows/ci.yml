name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows have no bwrap: the dist tests that run programs
        # in a sandbox are skipped there, and Windows has no distributions.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Also on Windows, where pwsh would go on after a failing command of
        # a multi-line step.
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.9

      # Pinned so new clippy lints do not turn CI red unannounced; bump
      # together with the toolchain used for development.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The e2e tests build every generated crate in target/e2e.
          cache-all-crates: true

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        # The dist tests run the built program in a sandbox. Ubuntu 24.04
        # restricts unprivileged user namespaces, which bwrap needs.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up the environment
        run: uv sync --locked

      - name: Point PyO3 at the virtual environment
        if: runner.os == 'Windows'
        # `.cargo/config.toml` names `.venv/bin/python`, which Windows does
        # not have; the environment variable takes precedence over it.
        run: echo "PYO3_PYTHON=$GITHUB_WORKSPACE/.venv/Scripts/python.exe" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: uv run pytest
