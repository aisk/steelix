name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows have no bwrap: the dist tests that run programs
        # in a sandbox are skipped there, and Windows has no distributions.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Also on Windows, where pwsh would go on after a failing command of
        # a multi-line step.
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # `.python-version` accepts any 3.14 so that developers need not have
      # this exact patch release; CI uses the one the copies of the standard
      # library in tests/apps come from.
      UV_PYTHON: "3.14.9"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      # Pinned so new clippy lints do not turn CI red unannounced; bump
      # together with the toolchain used for development.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The e2e tests build every generated crate in target/e2e.
          cache-all-crates: true

      # The dist tests run the built program in a sandbox, bwrap. The image
      # does not have it, and the Ubuntu mirror has been unreachable for
      # hours at a time, so the package is kept in the Actions cache and
      # only downloaded on a miss.
      - name: Cache bubblewrap
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/bubblewrap
          key: bubblewrap-${{ matrix.os }}-1

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        # The image comes with package lists, so a download usually needs no
        # `apt-get update`; it is only the fallback for a retry. Ubuntu 24.04
        # restricts unprivileged user namespaces, which bwrap needs.
        run: |
          if ! command -v bwrap > /dev/null; then
            mkdir -p ~/bubblewrap
            cd ~/bubblewrap
            for attempt in 1 2 3 4 5; do
              if ls ./*.deb > /dev/null 2>&1; then break; fi
              apt-get download -o Acquire::Retries=3 bubblewrap && break
              sleep $((attempt * 20))
              sudo apt-get update || true
            done
            sudo dpkg -i ./*.deb
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up the environment
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: uv run pytest
